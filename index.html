<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joyeux Anniversaire !</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #fdf6f0;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Écran de verrouillage */
    #lock-screen {
      text-align: center;
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      max-width: 360px;
      width: 90%;
    }

    #lock-screen h2 {
      margin-top: 0;
      color: #d86a84;
    }

    .input-group {
      margin-top: 20px;
    }

    input[type="password"] {
      padding: 12px 16px;
      font-size: 16px;
      border: 2px solid #eee;
      border-radius: 8px;
      width: 80%;
      outline: none;
      text-align: center;
      transition: border-color 0.3s;
    }

    input[type="password"]:focus {
      border-color: #d86a84;
    }

    button {
      margin-top: 15px;
      padding: 12px 24px;
      font-size: 16px;
      background-color: #d86a84;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #c4556f;
    }

    #error-message {
      color: #e74c3c;
      margin-top: 12px;
      font-size: 14px;
      display: none;
    }

    /* Contenu du site (masqué au départ) */
    #site-content {
      display: none;
      width: 100%;
      max-width: 800px;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="lock-screen">
    <h2>Espace Réservé ✨</h2>
    <p>Rentre le code secret pour déverrouiller ta surprise.</p>
    <div class="input-group">
      <input type="password" id="secret-input" placeholder="Ex: Ce qu'on ressent pour toi..." autofocus>
      <br>
      <button onclick="checkCode()">Déverrouiller</button>
    </div>
    <p id="error-message">Oups, ce n'est pas le bon code ! Réessaie.</p>
  </div>

  <div id="site-content">
    <h1>Joyeux Anniversaire ! 🎉</h1>
    <p>Bienvenue sur ton site surprise...</p>
    </div>

  <script>
    // Code d'accès secret
    const SECRET_CODE = "5201314"; 

    function checkCode() {
      const input = document.getElementById("secret-input").value;
      const errorMsg = document.getElementById("error-message");
      const lockScreen = document.getElementById("lock-screen");
      const siteContent = document.getElementById("site-content");

      if (input === SECRET_CODE) {
        lockScreen.style.display = "none";
        siteContent.style.display = "block";
      } else {
        errorMsg.style.display = "block";
        document.getElementById("secret-input").value = "";
      }
    }

    // Validation avec la touche "Entrée"
    document.getElementById("secret-input").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        checkCode();
      }
    });
  </script>
</body>
</html>
